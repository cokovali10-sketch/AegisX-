# Prometheus scrape config for the AegisX stack (docker compose profile: observability)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aegisx-phishguard
    metrics_path: /metrics
    static_configs:
      - targets: ["phishguard:8080"]
        labels:
          node: phishguard
