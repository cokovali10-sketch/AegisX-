name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        working-directory: sentinel-recon
        run: go build ./...

      - name: Vet
        working-directory: sentinel-recon
        run: go vet ./...

      - name: Test
        working-directory: sentinel-recon
        run: go test -race ./...

  go-shadowpot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        working-directory: shadowpot
        run: go build ./...

      - name: Vet
        working-directory: shadowpot
        run: go vet ./...

      - name: Test
        working-directory: shadowpot
        run: go test -race ./...

  rust-fim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zerotrust-fim/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('zerotrust-fim/Cargo.lock') }}

      - name: Test
        working-directory: zerotrust-fim
        run: cargo test --all-features

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd phishguard && pip install -r requirements.txt

      - name: Run tests
        run: cd phishguard && python -m pytest -q

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint proto
        run: buf lint

      - name: Verify generated code
        run: |
          make proto
          git diff --exit-code || (echo "Generated code is out of date." && exit 1)

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all Docker images
        run: docker compose build

      - name: Health check
        run: |
          docker compose up -d
          sleep 10
          curl -f http://localhost:8080/health || (docker compose logs && exit 1)
          docker compose down
